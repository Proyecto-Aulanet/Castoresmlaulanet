            <script>
document.addEventListener("DOMContentLoaded", () => {

    const btnSiguiente = document.getElementById("btnSiguiente");

    // Habilitar el botón cuando se seleccione una respuesta
    document.addEventListener("change", function(e){

        if(e.target.name === "respuesta"){

            btnSiguiente.disabled = false;

        }

    });

    // Avanzar
    btnSiguiente.addEventListener("click", () => {

        // Volver a deshabilitar hasta que elijan otra respuesta
        btnSiguiente.disabled = true;

        // Si existe la función siguientePregunta(), usarla
        if(typeof siguientePregunta === "function"){

            siguientePregunta();
            return;

        }

        // Si existe un arreglo global de preguntas
        if(
            typeof preguntas !== "undefined" &&
            typeof indiceActual !== "undefined"
        ){

            indiceActual++;

            if(indiceActual < preguntas.length){

                UILecciones.mostrarPregunta(
                    preguntas[indiceActual],
                    indiceActual,
                    preguntas.length,
                    puntaje || 0
                );

            }else{

                alert("Has terminado la evaluación.");

            }

        }else{

            console.warn("No existe la lógica del examen.");

        }

    });

});
</script>
